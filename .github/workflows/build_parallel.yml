name: Build and Push Parallel

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "*"
  pull_request:

jobs:
  compile_sketch:
    name: build ${{ matrix.board.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - { name: "Flipper Zero WiFi Dev Board",   flag: "MARAUDER_FLIPPER",         fbqn: "esp32:esp32:esp32s2:PartitionScheme=min_spiffs,FlashSize=4M,PSRAM=enabled",                     file_name: "flipper",                 tft: false, tft_file: "",                                   build_dir: "esp32s2",                    addr: "0x1000",   idf_ver: "2.0.11",   nimble_ver: "1.3.8",    esp_async: "bigbrodude6119/ESPAsyncWebServer",    esp_async_ver: "master" }
          - { name: "Flipper Zero Multi Board S3",   flag: "MARAUDER_MULTIBOARD_S3",   fbqn: "esp32:esp32:esp32s3:PartitionScheme=min_spiffs,FlashSize=4M",                                   file_name: "multiboardS3",            tft: false, tft_file: "",                                   build_dir: "esp32s3",                    addr: "0x0",      idf_ver: "2.0.11",   nimble_ver: "1.3.8",    esp_async: "bigbrodude6119/ESPAsyncWebServer",    esp_async_ver: "master" }
          - { name: "OG Marauder",                   flag: "MARAUDER_V4",              fbqn: "esp32:esp32:d32:PartitionScheme=min_spiffs",                                                    file_name: "old_hardware",            tft: true,  tft_file: "User_Setup_og_marauder.h",           build_dir: "d32",                        addr: "0x1000",   idf_ver: "3.3.4",    nimble_ver: "2.3.8",   esp_async: "bigbrodude6119/ESPAsyncWebServer",    esp_async_ver: "master" }
          - { name: "Marauder v6",                   flag: "MARAUDER_V6",              fbqn: "esp32:esp32:d32:PartitionScheme=min_spiffs",                                                    file_name: "v6",                      tft: true,  tft_file: "User_Setup_og_marauder.h",           build_dir: "d32",                        addr: "0x1000",   idf_ver: "3.3.4",    nimble_ver: "2.3.8",   esp_async: "bigbrodude6119/ESPAsyncWebServer",    esp_async_ver: "master" }
          - { name: "Marauder v6.1",                 flag: "MARAUDER_V6_1",            fbqn: "esp32:esp32:d32:PartitionScheme=min_spiffs",                                                    file_name: "v6_1",                    tft: true,  tft_file: "User_Setup_og_marauder.h",           build_dir: "d32",                        addr: "0x1000",   idf_ver: "3.3.4",    nimble_ver: "2.3.8",   esp_async: "bigbrodude6119/ESPAsyncWebServer",    esp_async_ver: "master" }
          - { name: "Marauder Kit",                  flag: "MARAUDER_KIT",             fbqn: "esp32:esp32:d32:PartitionScheme=min_spiffs",                                                    file_name: "kit",                     tft: true,  tft_file: "User_Setup_og_marauder.h",           build_dir: "d32",                        addr: "0x1000",   idf_ver: "3.3.4",    nimble_ver: "2.3.8",   esp_async: "bigbrodude6119/ESPAsyncWebServer",    esp_async_ver: "master" }
          - { name: "Marauder Mini",                 flag: "MARAUDER_MINI",            fbqn: "esp32:esp32:d32:PartitionScheme=min_spiffs",                                                    file_name: "mini",                    tft: true,  tft_file: "User_Setup_marauder_mini.h",         build_dir: "d32",                        addr: "0x1000",   idf_ver: "3.3.4",    nimble_ver: "2.3.8",   esp_async: "bigbrodude6119/ESPAsyncWebServer",    esp_async_ver: "master" }
          - { name: "ESP32 LDDB",                    flag: "ESP32_LDDB",               fbqn: "esp32:esp32:d32:PartitionScheme=min_spiffs",                                                    file_name: "esp32_lddb",              tft: false, tft_file: "",                                   build_dir: "d32",                        addr: "0x1000",   idf_ver: "3.3.4",    nimble_ver: "2.3.8",   esp_async: "bigbrodude6119/ESPAsyncWebServer",    esp_async_ver: "master" }
          - { name: "Marauder Dev Board Pro",        flag: "MARAUDER_DEV_BOARD_PRO",   fbqn: "esp32:esp32:d32:PartitionScheme=min_spiffs",                                                    file_name: "marauder_dev_board_pro",  tft: false, tft_file: "",                                   build_dir: "d32",                        addr: "0x1000",   idf_ver: "3.3.4",    nimble_ver: "2.3.8",   esp_async: "bigbrodude6119/ESPAsyncWebServer",    esp_async_ver: "master" }
          - { name: "M5StickCPlus",                  flag: "MARAUDER_M5STICKC",        fbqn: "esp32:esp32:m5stick-c:PartitionScheme=min_spiffs",                                              file_name: "m5stickc_plus",           tft: true,  tft_file: "User_Setup_marauder_m5stickc.h",     build_dir: "m5stick-c",                  addr: "0x1000",   idf_ver: "2.0.11",   nimble_ver: "1.3.8",    esp_async: "bigbrodude6119/ESPAsyncWebServer",    esp_async_ver: "master" }
          - { name: "M5StickCPlus 2",                flag: "MARAUDER_M5STICKCP2",      fbqn: "esp32:esp32:m5stick-c:PartitionScheme=min_spiffs",                                              file_name: "m5stickc_plus2",          tft: true,  tft_file: "User_Setup_marauder_m5stickcp2.h",   build_dir: "m5stick-c",                  addr: "0x1000",   idf_ver: "2.0.11",   nimble_ver: "1.3.8",    esp_async: "bigbrodude6119/ESPAsyncWebServer",    esp_async_ver: "master" }
          - { name: "Rev Feather",                   flag: "MARAUDER_REV_FEATHER",     fbqn: "esp32:esp32:esp32s2:PartitionScheme=min_spiffs,FlashSize=4M,PSRAM=enabled",                     file_name: "rev_feather",             tft: true,  tft_file: "User_Setup_marauder_rev_feather.h",  build_dir: "esp32s2",                    addr: "0x1000",   idf_ver: "2.0.11",   nimble_ver: "1.3.8",    esp_async: "bigbrodude6119/ESPAsyncWebServer",    esp_async_ver: "master" }
          - { name: "Marauder v7",                   flag: "MARAUDER_V7",              fbqn: "esp32:esp32:d32:PartitionScheme=min_spiffs",                                                    file_name: "marauder_v7",             tft: true,  tft_file: "User_Setup_dual_nrf24.h",            build_dir: "d32",                        addr: "0x1000",   idf_ver: "3.3.4",    nimble_ver: "2.3.8",   esp_async: "bigbrodude6119/ESPAsyncWebServer",    esp_async_ver: "master" }
          - { name: "Marauder CYD 2432S028",         flag: "MARAUDER_CYD_MICRO",       fbqn: "esp32:esp32:d32:PartitionScheme=min_spiffs",                                                    file_name: "cyd_2432S028",            tft: true,  tft_file: "User_Setup_cyd_micro.h",             build_dir: "d32",                        addr: "0x1000",   idf_ver: "2.0.11",   nimble_ver: "1.3.8",    esp_async: "bigbrodude6119/ESPAsyncWebServer",    esp_async_ver: "master" }
          - { name: "Marauder CYD 2432S028 Inverted", flag: "MARAUDER_CYD_MICRO_INVERTED", fbqn: "esp32:esp32:d32:PartitionScheme=min_spiffs",                                                    file_name: "cyd_2432S028_inverted",   tft: true,  tft_file: "User_Setup_cyd_micro_inverted.h",    build_dir: "d32",                        addr: "0x1000",   idf_ver: "2.0.11",   nimble_ver: "1.3.8",    esp_async: "bigbrodude6119/ESPAsyncWebServer",    esp_async_ver: "master" }
          - { name: "Marauder CYD 2432S024 GUITION", flag: "MARAUDER_CYD_GUITION",     fbqn: "esp32:esp32:d32:PartitionScheme=min_spiffs",                                                    file_name: "cyd_2432S024_guition",    tft: true,  tft_file: "User_Setup_cyd_guition.h",           build_dir: "d32",                        addr: "0x1000",   idf_ver: "2.0.11",   nimble_ver: "1.3.8",    esp_async: "bigbrodude6119/ESPAsyncWebServer",    esp_async_ver: "master" }
          - { name: "Marauder CYD 2432S028 2 USB",   flag: "MARAUDER_CYD_2USB",        fbqn: "esp32:esp32:d32:PartitionScheme=min_spiffs",                                                    file_name: "cyd_2432S028_2usb",       tft: true,  tft_file: "User_Setup_cyd_2usb.h",              build_dir: "d32",                        addr: "0x1000",   idf_ver: "2.0.11",   nimble_ver: "2.3.8",   esp_async: "bigbrodude6119/ESPAsyncWebServer",    esp_async_ver: "master" }
          - { name: "Marauder CYD 3.5inch",          flag: "MARAUDER_CYD_3_5_INCH",    fbqn: "esp32:esp32:d32:PartitionScheme=min_spiffs",                                                    file_name: "cyd_3_5_inch",            tft: true,  tft_file: "User_Setup_cyd_3_5_inch.h",          build_dir: "d32",                        addr: "0x1000",   idf_ver: "2.0.11",   nimble_ver: "1.3.8",    esp_async: "bigbrodude6119/ESPAsyncWebServer",    esp_async_ver: "master" }
          - { name: "M5Cardputer",                   flag: "MARAUDER_CARDPUTER",       fbqn: "esp32:esp32:esp32s3:PartitionScheme=min_spiffs,FlashSize=8M,PSRAM=disabled",                    file_name: "m5cardputer",             tft: true,  tft_file: "User_Setup_marauder_m5cardputer.h",  build_dir: "esp32s3",                    addr: "0x1000",   idf_ver: "2.0.11",   nimble_ver: "1.3.8",    esp_async: "bigbrodude6119/ESPAsyncWebServer",    esp_async_ver: "master" }
          - { name: "M5Cardputer ADV",               flag: "MARAUDER_CARDPUTER_ADV",   fbqn: "esp32:esp32:esp32s3:PartitionScheme=min_spiffs,FlashSize=8M,PSRAM=disabled",                    file_name: "m5cardputer_adv",         tft: true,  tft_file: "User_Setup_marauder_m5cardputer_adv.h",  build_dir: "esp32s3",                addr: "0x1000",   idf_ver: "2.0.11",   nimble_ver: "1.3.8",    esp_async: "bigbrodude6119/ESPAsyncWebServer",    esp_async_ver: "master" }
          - { name: "ESP32-C5-DevKitC-1",            flag: "MARAUDER_C5",              fbqn: "esp32:esp32:esp32c5:FlashSize=8M,PartitionScheme=min_spiffs,PSRAM=enabled",                     file_name: "esp32c5devkitc1",         tft: false, tft_file: "",                                   build_dir: "esp32c5",                    addr: "0x2000",   idf_ver: "3.3.4",    nimble_ver: "2.3.8",   esp_async: "bigbrodude6119/ESPAsyncWebServer",    esp_async_ver: "master" }
          - { name: "M5NanoC6",                      flag: "MARAUDER_M5_NANO_C6",      fbqn: "esp32:esp32:esp32c6:CDCOnBoot=cdc,PartitionScheme=min_spiffs",                                  file_name: "m5nanoc6",                tft: false, tft_file: "",                                   build_dir: "esp32c6",                    addr: "0x2000",   idf_ver: "3.3.4",    nimble_ver: "2.3.8",   esp_async: "bigbrodude6119/ESPAsyncWebServer",    esp_async_ver: "master" }
          - { name: "Marauder Pancake",              flag: "MARAUDER_PANCAKE",         fbqn: "esp32:esp32:esp32c5:FlashSize=8M,PartitionScheme=default_8MB,PSRAM=enabled",                    file_name: "pancake",                 tft: true,  tft_file: "User_Setup_marauder_pancake.h",      build_dir: "esp32c5",                    addr: "0x2000",   idf_ver: "3.3.4",    nimble_ver: "2.3.8",   esp_async: "bigbrodude6119/ESPAsyncWebServer",    esp_async_ver: "master", tft_repo: "H4W9/TFT_eSPI", tft_ref: "ESP32-C5" }
          
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
          
      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "${GITHUB_WORKSPACE}/bin" >> $GITHUB_PATH
          export PATH=$PATH:${GITHUB_WORKSPACE}/bin
          arduino-cli version

      #- name: Install Arduino-ESP32 Core v${{ matrix.board.idf_ver }}
      #  run: |
      #    arduino-cli core update-index
      #    arduino-cli core install esp32:esp32@${{ matrix.board.idf_ver }}

      - name: Verify Installed Cores
        run: arduino-cli core list

      - name: Build TestFile with ESP32 v${{ matrix.board.idf_ver }}
        uses: ArminJo/arduino-test-compile@v3.2.1
        with:
          sketch-names: TestFile.ino
          arduino-board-fqbn: esp32:esp32:esp32s2
          arduino-platform: esp32:esp32@${{ matrix.board.idf_ver }}
          platform-url: https://github.com/espressif/arduino-esp32/releases/download/${{ matrix.board.idf_ver }}/package_esp32_dev_index.json

      - name: Verify Installed Cores Again
        run: arduino-cli core list
          
      - name: Show Arduino dir structure
        run: |
          find /home/runner/.arduino15/packages/esp32/hardware/
          
      - name: Install ESP32Ping
        uses: actions/checkout@v2
        with:
          repository: marian-craciunescu/ESP32Ping
          ref: 1.6
          path: CustomESP32Ping
          
      - name: Install AsyncTCP
        uses: actions/checkout@v2
        with:
          repository: ESP32Async/AsyncTCP
          ref: v3.4.8
          path: CustomAsyncTCP
          
      - name: Install MicroNMEA
        uses: actions/checkout@v2
        with:
          repository: stevemarple/MicroNMEA
          ref: v2.0.6
          path: CustomMicroNMEA
          
      - name: Install ESPAsyncWebServer
        uses: actions/checkout@v2
        with:
          repository: ESP32Async/ESPAsyncWebServer
          ref: v3.8.1
          path: CustomESPAsyncWebServer
      
      #- name: Install ESPAsyncWebServer
      #  run: |
      #    cp -r libraries/ESPAsyncWebServer ./CustomESPAsyncWebServer
          
      - name: Install TFT_eSPI
        uses: actions/checkout@v2
        with:
          repository: ${{ matrix.board.tft_repo || 'Bodmer/TFT_eSPI' }}
          ref: ${{ matrix.board.tft_ref || 'V2.5.34' }}
          path: CustomTFT_eSPI

      - name: Install XPT2046_Touchscreen
        uses: actions/checkout@v2
        with:
          repository: PaulStoffregen/XPT2046_Touchscreen
          ref: v1.4
          path: CustomXPT2046_Touchscreen

      - name: Install lv_arduino
        uses: actions/checkout@v2
        with:
          repository: lvgl/lv_arduino
          ref: 3.0.0
          path: Customlv_arduino

      - name: Install JPEGDecoder
        uses: actions/checkout@v2
        with:
          repository: Bodmer/JPEGDecoder
          ref: 1.8.0
          path: CustomJPEGDecoder

      - name: Install NimBLE-Arduino
        uses: actions/checkout@v2
        with:
          repository: h2zero/NimBLE-Arduino
          ref: ${{ matrix.board.nimble_ver }}
          path: CustomNimBLE-Arduino

      - name: Install Adafruit_NeoPixel
        uses: actions/checkout@v2
        with:
          repository: adafruit/Adafruit_NeoPixel
          ref: 1.12.0
          path: CustomAdafruit_NeoPixel

      - name: Install ArduinoJson
        uses: actions/checkout@v2
        with:
          repository: bblanchon/ArduinoJson
          ref: v6.18.2
          path: CustomArduinoJson
          
      - name: Install LinkedList
        uses: actions/checkout@v2
        with:
          repository: ivanseidel/LinkedList
          ref: v1.3.3
          path: CustomLinkedList
          
      - name: Install EspSoftwareSerial
        uses: actions/checkout@v2
        with:
          repository: plerup/espsoftwareserial
          ref: 8.1.0
          path: CustomEspSoftwareSerial
          
      - name: Install Adafruit_BusIO
        uses: actions/checkout@v2
        with:
          repository: adafruit/Adafruit_BusIO
          ref: 1.15.0
          path: CustomAdafruit_BusIO
          
      - name: Install Adafruit_MAX1704X
        uses: actions/checkout@v2
        with:
          repository: adafruit/Adafruit_MAX1704X
          ref: 1.0.2
          path: CustomAdafruit_MAX1704X

      - name: Install Adafruit_TCA8418
        run: cp -r libraries/Adafruit_TCA8418 CustomAdafruit_TCA8418

      - name: Show Libraries
        run: |
          find /home/runner/ -name "Custom*"
          
      - name: Configure TFT_eSPI
        run: |
          rm -f CustomTFT_eSPI/User_Setup_Select.h
          cp User*.h CustomTFT_eSPI/
          pwd
          ls -la
          ls -la CustomTFT_eSPI

      - name: Install Esptool
        run: |
          pip install esptool

      - name: Modify platform.txt
        run: |
          if [[ ${{ matrix.board.idf_ver }} == "2.0.11" ]]; then
            for i in $(find /home/runner/.arduino15/packages/esp32/hardware/esp32/ -name "platform.txt"); do
              sed -i 's/compiler.c.elf.libs.esp32c3=/compiler.c.elf.libs.esp32c3=-zmuldefs /' "$i"
              sed -i 's/compiler.c.elf.libs.esp32s3=/compiler.c.elf.libs.esp32s3=-zmuldefs /' "$i"
              sed -i 's/compiler.c.elf.libs.esp32s2=/compiler.c.elf.libs.esp32s2=-zmuldefs /' "$i"
              sed -i 's/compiler.c.elf.libs.esp32=/compiler.c.elf.libs.esp32=-zmuldefs /' "$i"
              sed -i 's/-fexceptions/-fno-exceptions/g' "$i"
              cat "$i" | grep compiler.c.elf.libs.esp32c3
              cat "$i" | grep compiler.c.elf.libs.esp32s3
              cat "$i" | grep compiler.c.elf.libs.esp32s2
              cat "$i" | grep compiler.c.elf.libs.esp32
            done
          fi
          
          if [[ ${{ matrix.board.idf_ver }} == "3.3.4" ]]; then
            for i in $(find /home/runner/.arduino15/packages/esp32/hardware/esp32/ -name "platform.txt"); do
              sed -i 's/compiler.c.elf.extra_flags=/compiler.c.elf.extra_flags=-Wl,-zmuldefs /' "$i"
            done
            for f in $(find /home/runner/.arduino15/packages/esp32/tools/esp32-arduino-libs/ -name "cpp_flags"); do
              sed -i 's/-fexceptions/-fno-exceptions/g' "$f"
            done
          fi
          
      - name: Configure TFT_eSPI (if needed)
        run: |
          pwd
          if [[ ${{ matrix.board.tft }} == true ]]; then
            find /home/runner/ -name "*TFT_eSPI*"
            sed -i 's/^\/\/#include <${{ matrix.board.tft_file }}>/#include <${{ matrix.board.tft_file }}>/' ${GITHUB_WORKSPACE}/CustomTFT_eSPI/User_Setup_Select.h
          fi

      - name: Build Marauder for ${{ matrix.board.name }}
        uses: ArminJo/arduino-test-compile@v3.3.0
        with:
          sketch-names: esp32_marauder.ino
          arduino-board-fqbn: ${{ matrix.board.fbqn }}
          extra-arduino-cli-args: "--warnings none --build-property compiler.cpp.extra_flags='-D${{ matrix.board.flag }}'"
          arduino-platform: esp32:esp32@${{ matrix.board.idf_ver }}
          platform-url: https://github.com/espressif/arduino-esp32/releases/download/${{ matrix.board.idf_ver }}/package_esp32_dev_index.json

      #- name: Rename Marauder ${{ matrix.board.name }} bin
      #  run: |
      #    mv ./esp32_marauder/build/esp32.esp32.${{ matrix.board.build_dir }}/esp32_marauder.ino.bin ./esp32_marauder/build/esp32.esp32.${{ matrix.board.build_dir }}/esp32_marauder.${{ matrix.board.file_name }}.bin
      
      - name: Rename and Upload ${{ matrix.board.name }} Artifact
        run: |
          VERSION=$(grep '#define MARAUDER_VERSION' ./esp32_marauder/configs.h | sed -E 's/.*"v([^"]+)"/v\1/' | tr '.' '_')
          DATE=$(date +%Y%m%d)

          BUILD_DIR=./esp32_marauder/build/esp32.esp32.${{ matrix.board.build_dir }}
          INPUT_BIN=$BUILD_DIR/esp32_marauder.ino.bin
          OUTPUT_BIN=esp32_marauder_${VERSION}_${DATE}_${{ matrix.board.file_name }}.bin
          VERSION_DOT=${VERSION_DOT}

          mv "$INPUT_BIN" "$BUILD_DIR/$OUTPUT_BIN"

          echo "artifact_name=$OUTPUT_BIN" >> $GITHUB_ENV
          echo "artifact_path=$BUILD_DIR/$OUTPUT_BIN" >> $GITHUB_ENV
      - name: Upload ${{ matrix.board.name }} Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: ${{ env.artifact_path }}
          retention-days: 5

      # The release artifact above is the application image on its own, which is
      # all esptool needs when the board already has a bootloader. The web
      # flasher erases first, so it has to write the full set. Collected as a
      # separate artifact so the release job's glob keeps matching only the
      # application bins.
      - name: Stage ${{ matrix.board.name }} Web Flasher Bins
        if: ${{ startsWith(matrix.board.file_name, 'cyd_') }}
        run: |
          set -euo pipefail

          VERSION_DOT=$(grep '#define MARAUDER_VERSION' ./esp32_marauder/configs.h | sed -E 's/.*"v([^"]+)"/\1/')
          BUILD_DIR=./esp32_marauder/build/esp32.esp32.${{ matrix.board.build_dir }}
          STAGE=./webflasher_stage/${{ matrix.board.file_name }}

          mkdir -p "$STAGE"
          cp "$BUILD_DIR/${{ env.artifact_name }}"          "$STAGE/firmware.bin"
          cp "$BUILD_DIR/esp32_marauder.ino.bootloader.bin" "$STAGE/bootloader.bin"
          cp "$BUILD_DIR/esp32_marauder.ino.partitions.bin" "$STAGE/partitions.bin"

          # boot_app0 ships with the core rather than the sketch build.
          BOOT_APP0=$(find /home/runner/.arduino15/packages/esp32 -name boot_app0.bin | head -n 1)
          if [ -z "$BOOT_APP0" ]; then
            echo "::error::boot_app0.bin not found in the installed ESP32 core"
            exit 1
          fi
          cp "$BOOT_APP0" "$STAGE/boot_app0.bin"

          # esp-web-tools takes byte offsets, not hex strings.
          BOOTLOADER_OFFSET=$(( ${{ matrix.board.addr }} ))

          cat > "$STAGE/manifest.json" <<EOF
          {
            "name": "ESP32 Marauder — ${{ matrix.board.name }}",
            "version": "$VERSION_DOT",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32",
                "parts": [
                  { "path": "bootloader.bin", "offset": $BOOTLOADER_OFFSET },
                  { "path": "partitions.bin", "offset": 32768 },
                  { "path": "boot_app0.bin",  "offset": 57344 },
                  { "path": "firmware.bin",   "offset": 65536 }
                ]
              }
            ]
          }
          EOF

          python3 -c "import json,sys; json.load(open('$STAGE/manifest.json'))"
          ls -la "$STAGE"

      - name: Upload ${{ matrix.board.name }} Web Flasher Bins
        if: ${{ startsWith(matrix.board.file_name, 'cyd_') }}
        uses: actions/upload-artifact@v4
        with:
          name: webflasher-${{ matrix.board.file_name }}
          path: ./webflasher_stage/${{ matrix.board.file_name }}
          retention-days: 5

  post_compile_steps:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [compile_sketch]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps: 
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          
      - name: Get Tag Version
        run: |
          VERSION_DOT=$(grep '#define MARAUDER_VERSION' ./esp32_marauder/configs.h | sed -E 's/.*"v([^"]+)"/v\1/')
          echo "version_dot=$VERSION_DOT" >> $GITHUB_ENV
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: "Marauder Release ${{ github.ref_name }}"
          tag_name: ${{ env.version_dot }}
          generate_release_notes: false
          draft: true
          files: |
            esp32_marauder_v*.bin
          body: |
            **[Marauder Discord](https://discord.com/servers/willstunforfood-776211399918878760)**
            **[Webflasher for CYDs](https://codehedge.github.io/Adafruit_WebSerial_ESPTool/)**
            
            ### CYD BUILDS DIFFER FROM MAIN JCMK BUILD
            **For the time being CYD boards have had HAS_BATTERY removed from the official firmware. This is to support the people that have custom builds with battery level feeback.**
            **Also added support for some people using older CYDs that need inversion -- CYD 2432S028(R) Inverted**

            

            | Hardware | Binary Version |
            | -------- | -------------- |
            | v4 (OG) | `_old_hardware.bin` |
            | v6 | `_new_hardware.bin`/`_v6.bin` |
            | v6.1/v6.2 | `_v6_1.bin` |
            | v7 | `_v7.bin` |
            | v8 | `_v8.bin` |
            | Kit | `_kit.bin` |
            | Mini | `_mini.bin` |
            | Mini v3 | `_mini_v3.bin` |
            | Flipper Zero | `_flipper.bin` |
            | MutliBoard S3 | `_multiboardS3.bin` |
            | LDDB/NodeMCU/Wemos | `_lddb.bin` |
            | Dev Board Pro | `_marauder_dev_board_pro.bin` |
            | BFFB | `_marauder_dev_board_pro.bin` |
            | ESP32-S2 Reverse Feather | `_rev_feather.bin` |
            | CYD 2432S028(R) | `_cyd_2432S028.bin` |
            | CYD 2432S028(R) Inverted | `_cyd_2432S028_inverted.bin` |
            | RL Phantom | `_cyd_2432S024_guition.bin` |
            | CYD 2432S028 2 USB | `_cyd_2432S028_2usb.bin` |
            | M5 Cardputer | `_m5cardputer.bin` (Available on M5 Burner) |
            | M5 Cardputer ADV | `_m5cardputer_adv.bin` |
            | ESP32-C5 DevKit | [`_esp32c5_devkit.bin`](https://github.com/justcallmekoko/ESP32Marauder/wiki/ESP32%E2%80%90C5%E2%80%90DevKitC%E2%80%901) |
            | AWOK V2/V3 screen (white usb) | `_v6_1.bin` |
            | AWOK V2 flipper (orange usb) | `_flipper.bin` |
            | AWOK V3 flipper (orange usb) | `_marauder_dev_board_pro.bin` |

  sync_cyd_webflasher:
    name: Sync CYD Files to WebFlasher
    runs-on: ubuntu-latest
    needs: [post_compile_steps]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout ESP32Marauder
        uses: actions/checkout@v4

      - name: Get Version Info
        id: version
        run: |
          VERSION_UNDERSCORE=$(grep '#define MARAUDER_VERSION' ./esp32_marauder/configs.h | sed -E 's/.*"v([^"]+)"/v\1/' | tr '.' '_')
          VERSION_DOT=$(grep '#define MARAUDER_VERSION' ./esp32_marauder/configs.h | sed -E 's/.*"v([^"]+)"/\1/')
          DATE=$(date +%Y%m%d)
          echo "version_underscore=$VERSION_UNDERSCORE" >> $GITHUB_OUTPUT
          echo "version_dot=$VERSION_DOT" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - name: Download CYD Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: esp32_marauder_*_cyd_*
          merge-multiple: true
          path: ./cyd_bins

      - name: Checkout WebFlasher Repo
        uses: actions/checkout@v4
        with:
          repository: CodeHedge/Adafruit_WebSerial_ESPTool
          token: ${{ secrets.WEBFLASHER }}
          path: webflasher

      - name: Archive Old Files and Update Current
        run: |
          # Move old bins from CURRENT to PREVIOUS
          mkdir -p webflasher/resources/PREVIOUS
          if ls webflasher/resources/CURRENT/*.bin 1> /dev/null 2>&1; then
            mv webflasher/resources/CURRENT/*.bin webflasher/resources/PREVIOUS/
          fi
          
          # Copy new bins to CURRENT
          cp ./cyd_bins/*.bin webflasher/resources/CURRENT/

      - name: Generate Manifest
        run: |
          VERSION="${{ steps.version.outputs.version_dot }}"
          DATE="${{ steps.version.outputs.date }}"
          VER_US="${{ steps.version.outputs.version_underscore }}"
          
          cat > webflasher/resources/CURRENT/manifest.json << EOF
          {
            "version": "$VERSION",
            "devices": [
              {
                "id": "CYD2USB_INVERT_OFF",
                "name": "CYD2USB V2 2.8\" (Display Invert Off)",
                "group": "ESP32-2432S028R V2 2.8\" Cheap-Yellow-Display",
                "files": {
                  "bootloader": "resources/STATIC/M/CYD/esp32_marauder.ino.bootloader.bin",
                  "partitions": "resources/STATIC/M/CYD/esp32_marauder.ino.partitions.bin",
                  "firmware": "resources/CURRENT/esp32_marauder_${VER_US}_${DATE}_cyd_2432S028.bin"
                }
              },
              {
                "id": "CYD2USB_INVERT_ON",
                "name": "CYD2USB V2 2.8\" (Display Invert On)",
                "group": "ESP32-2432S028R V2 2.8\" Cheap-Yellow-Display",
                "files": {
                  "bootloader": "resources/STATIC/M/CYD/esp32_marauder.ino.bootloader.bin",
                  "partitions": "resources/STATIC/M/CYD/esp32_marauder.ino.partitions.bin",
                  "firmware": "resources/CURRENT/esp32_marauder_${VER_US}_${DATE}_cyd_2432S028_inverted.bin"
                }
              },
              {
                "id": "CYD2USB_V21_INVERT_OFF",
                "name": "CYD2USB V2.1 2.8\" (Display Invert Off)",
                "group": "ESP32-2432S028R V2.1 2.8\" Cheap-Yellow-Display",
                "files": {
                  "bootloader": "resources/STATIC/M/CYD/esp32_marauder.ino.bootloader.bin",
                  "partitions": "resources/STATIC/M/CYD/esp32_marauder.ino.partitions.bin",
                  "firmware": "resources/CURRENT/esp32_marauder_${VER_US}_${DATE}_cyd_2432S028_2usb.bin"
                }
              }
            ]
          }
          EOF

      - name: Commit and Push
        working-directory: webflasher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resources/CURRENT/ resources/PREVIOUS/
          git commit -m "Update Marauder CYD firmware to ${{ steps.version.outputs.version_dot }}"
          git push
  publish_webflasher:
    name: Publish Web Flasher to Pages
    runs-on: ubuntu-latest
    needs: [compile_sketch]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    steps:
      - name: Checkout ESP32Marauder
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Download Web Flasher Bins
        uses: actions/download-artifact@v4
        with:
          pattern: webflasher-*
          path: ./webflasher_artifacts

      - name: Lay Out docs/firmware
        run: |
          set -euo pipefail

          # Each artifact unpacks to webflasher_artifacts/webflasher-<file_name>/.
          # Strip the prefix so the directory matches the board id the page asks
          # for in ./firmware/<id>/manifest.json.
          rm -rf docs/firmware
          published=0

          for dir in ./webflasher_artifacts/webflasher-*/; do
            [ -d "$dir" ] || continue
            board=$(basename "$dir")
            board=${board#webflasher-}

            for f in manifest.json firmware.bin bootloader.bin partitions.bin boot_app0.bin; do
              if [ ! -f "$dir/$f" ]; then
                echo "::error::$board is missing $f"
                exit 1
              fi
            done

            mkdir -p "docs/firmware/$board"
            cp "$dir"/*.bin "$dir/manifest.json" "docs/firmware/$board/"
            published=$((published + 1))
            echo "Published $board"
          done

          if [ "$published" -eq 0 ]; then
            echo "::error::No web flasher artifacts were found"
            exit 1
          fi

          echo "Published $published board(s)"
          find docs/firmware -type f | sort

      - name: Commit and Push
        run: |
          set -euo pipefail

          VERSION_DOT=$(grep '#define MARAUDER_VERSION' ./esp32_marauder/configs.h | sed -E 's/.*"v([^"]+)"/\1/')

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/firmware

          if git diff --cached --quiet; then
            echo "Firmware is already up to date, nothing to commit"
            exit 0
          fi

          git commit -m "Publish Marauder CYD v${VERSION_DOT} to the web flasher"
          git push origin master
